[package]
name = "hv-desktop"
version.workspace = true
edition.workspace = true

[features]
default = ["sherpa"]
sherpa = []

[[bin]]
name = "hv-bible"
path = "src/main.rs"

[dependencies]
hv-pipeline = { path = "../hv-pipeline" }
hv-asr = { path = "../hv-asr", features = ["sherpa"] }
hv-audio = { path = "../hv-audio" }
hv-vad = { path = "../hv-vad" }
bible-core = { path = "../bible-core" }
bible-rt = { path = "../bible-rt" }
eframe = "0.29"
egui = "0.29"
crossbeam-channel = { workspace = true }
serde = { workspace = true }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = "0.3"
