# ─────────────────────────────────────────────────────────────────────
# English Book Name Aliases
#
# Used by bible-core/build.rs to generate a compile-time PHF map:
#   alias (lowercase) → BookId (u8)
#
# Each book entry lists all recognized forms:
#   - Full canonical name
#   - Standard abbreviations
#   - Ordinal/spoken forms (for ASR pipeline)
#   - Common informal names
#
# All matching is case-insensitive at runtime (aliases stored lowercase).
# ─────────────────────────────────────────────────────────────────────

