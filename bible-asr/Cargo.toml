[package]
name = "bible-asr"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "ASR pipeline: wraps sherpa-onnx, OS-specific audio capture behind a trait."

[features]
default = []
sherpa = ["dep:sherpa-onnx"]
desktop-audio = ["dep:cpal"]

[dependencies]
bible-core = { path = "../bible-core" }
crossbeam-channel = { workspace = true }
thiserror = { workspace = true }
sherpa-onnx = { version = "1.13.6", optional = true }
cpal = { version = "0.15", optional = true }

# Platform-specific dependencies will be added in Phase 3
# For now, we use mock implementations

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
